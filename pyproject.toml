[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "research-assistant"
version = "0.1.0"
description = "Source-grounded scientific literature assistant (M0 foundation)."
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.6.0",
  "sentence-transformers==4.1.0",
  "transformers>=4.41,<5",
  "openai==3.46.0",
  "ollama==0.6.3",
  "neo4j==5.28.5",
  "PyMuPDF==1.25.5",
  "streamlit==1.45.1",
  "pandas>=2.2,<3",
  "pydantic>=2,<3",
  "python-dotenv==1.0.1",
  "tiktoken>=0.9,<1",
]

[dependency-groups]
dev = ["pytest==8.3.5"]

[tool.uv]
cache-dir = ".cache/uv"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[tool.hatch.build.targets.wheel]
packages = ["src/research_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: opt-in local service or model checks"]
